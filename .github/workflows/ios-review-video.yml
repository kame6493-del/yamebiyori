# App Review(Guideline 2.1 Information Needed)に出す画面録画を、GitHub のクラウド Mac の iPhone シミュレーター(最新 iOS)で撮る。
# 持ち主は iPhone を持っていないので実機では撮れない。録画用ビルド(VITE_REVIEW_TOUR=1)は起動すると src/dev/reviewTour.ts が
# 「はじめの画面で入力 → ホーム → 飲みたくなった/吸いたくなった → 乗り切れた → 記録 → 体のこと → 完全版の購入画面」を自動で操作する。製品版には入らない。
# flavor に sake / tabako を選ぶ。ニガテ帳(管理栄養士)で審査に通った手順を写した物。Actions の画面から手で実行する(シークレット不要)。
name: iOS review video

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "どのアプリか(flavors の下のフォルダ名)"
        type: choice
        options: [both, sake, tabako]
        default: both

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build web assets (review tour) and sync iOS
        run: |
          npm ci --no-audit --no-fund
          node scripts/use-flavor.mjs "${{ inputs.flavor }}"
          echo "NATIVE=$(node -p "require('./flavors/${{ inputs.flavor }}/flavor.json').native || '${{ inputs.flavor }}'")" >> "$GITHUB_ENV"
          VITE_REVIEW_TOUR=1 npm run build
          npx cap sync ios

      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project flavors/${{ env.NATIVE }}/ios/App/App.xcodeproj \
            -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO -quiet

      # はじめの入力を終えると記念日のお知らせの許可を OS が聞く。録画の途中で確認が出たまま止まらないよう、
      # 先に許可しておく(applesimutils。入らなかったときは確認が画面に出たまま録画される)
      - name: Install applesimutils (pre-allow notifications)
        continue-on-error: true
        run: |
          brew tap wix/brew
          brew install applesimutils

      - name: Record on the newest iPhone simulator
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          rts=sorted([k for k in d if "iOS" in k], key=lambda k:[int(x) for x in re.findall(r"\d+",k.split("iOS")[-1])])
          devs=[x for x in d[rts[-1]] if x["name"].startswith("iPhone")]
          pro=[x for x in devs if "Pro" in x["name"] and "Max" not in x["name"]]
          print((pro or devs)[-1]["udid"])')
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/*.app | head -1)
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          if command -v applesimutils >/dev/null; then applesimutils --byId "$UDID" --bundle "$BID" --setPermissions notifications=YES || true; fi
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          sleep 5
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$RUNNER_TEMP/review-${{ inputs.flavor }}.mp4" &
          REC=$!
          sleep 3
          xcrun simctl launch "$UDID" "$BID"
          sleep 130
          kill -INT $REC
          wait $REC || true
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/last-${{ inputs.flavor }}.png"
          sw_vers; xcrun simctl list runtimes | tail -3
          ls -la "$RUNNER_TEMP"/review-*.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: review-video-yamebiyori-${{ inputs.flavor }}
          path: |
            ${{ runner.temp }}/review-${{ inputs.flavor }}.mp4
            ${{ runner.temp }}/last-${{ inputs.flavor }}.png
